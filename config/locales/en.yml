en:
  label_redmine_zulip: Zulip
  zulip_settings_header: Zulip Plugin Configuration
  zulip_settings_label_url: Zulip URL
  zulip_settings_label_email: Zulip Bot Email
  zulip_settings_label_api_key: Zulip Bot API key
  zulip_settings_label_stream_expression: Stream name
  zulip_settings_label_issue_updates_subject_expression: >
    Issue updates subject
  zulip_settings_label_version_updates_subject_expression: >
    Version updates subject
  field_zulip_url: Zulip URL
  field_zulip_email: Zulip e-mail
  field_zulip_api_key: Zulip Bot API key
  field_zulip_stream_expression: Stream name
  field_zulip_issue_updates_subject_expression:  >
    Issue updates subject
  field_zulip_version_updates_subject_expression: >
    Version updates subject
  zulip_notify_assignment: >
    %{user} **assigned** issue [[%{project}#%{id}] %{subject}](%{url}) to **you**:


    ~~~quote

    %{description}

    ~~~


    * **%{status_label}**: %{status}


  zulip_notify_unassignment: >
    %{user} **unassigned** issue [[%{project}#%{id}] %{subject}](%{url}) from **you**.

  zulip_notify_updated: >
    %{user} **updated** issue [[%{project}#%{id}] %{subject}](%{url}).

  zulip_notify_destroyed: >
    %{user} **deleted** issue **%{id}: %{subject}**.

  zulip_init_issue_subject: >
    %{user} **created** issue [[%{project}#%{id}] %{subject}](%{url}):


    ~~~quote

    %{description}

    ~~~

    * **%{assigned_to_label}**: %{assigned_to}

    * **%{status_label}**: %{status}

  zulip_update_version_subject_added: >
    %{user} **added** issue [[%{project}#%{id}] %{subject}](%{url}) to version **%{fixed_version}**.

  zulip_update_version_subject_removed: >
    %{user} **removed** issue [[%{project}#%{id}] %{subject}](%{url}) from version **%{fixed_version}**.

  zulip_update_version_subject_status: >
    %{user} **changed status** of issue [[%{project}#%{id}] %{subject}](%{url}) from
    *~~%{previous_status}~~* to **%{current_status}**.

  zulip_notify_news_added: "**[%{title}](%{url})**\n%{user} **added news**."

  zulip_notify_news_comment_added: "**[%{title}](%{url})**\n%{user} **commented on news**."

  zulip_notify_document_added: "**[%{title}](%{url})**\n%{user} **added document** (%{category})."

  zulip_notify_file_added: "**[%{container}](%{url})**\n%{user} **added files**."

  zulip_notify_message_posted: "**[%{subject}](%{url})**\n%{user} **posted a message to %{board}**."

  zulip_notify_wiki_added: "**[%{title}](%{url})**\n%{user} **created wiki page**."

  zulip_notify_wiki_updated: "**[%{title}](%{url})**\n%{user} **updated wiki page**."

  zulip_notify_wiki_diff: "**Diff**: [%{url}](%{url})"
