de:
  label_redmine_zulip: Zulip
  zulip_settings_header: Zulip Plugin Konfiguration
  zulip_settings_label_url: Zulip URL
  zulip_settings_label_email: Zulip Bot E-Mail
  zulip_settings_label_api_key: Zulip Bot API Key
  zulip_settings_label_stream_expression: Stream Name
  zulip_settings_label_issue_updates_subject_expression: >
    Ticket-Update-Betreff
  zulip_settings_label_version_updates_subject_expression: >
    Versions-Update-Betreff
  field_zulip_url: Zulip URL
  field_zulip_email: Zulip E-Mail
  field_zulip_api_key: Zulip Bot API Key
  field_zulip_stream_expression: Stream Name
  field_zulip_issue_updates_subject_expression:  >
    Ticket-Update-Betreff
  field_zulip_version_updates_subject_expression: >
    Versions-Update-Betreff
  zulip_notify_assignment: >
    %{user} hat **Ihnen** Ticket [[%{project}#%{id}] %{subject}](%{url}) **zugewiesen**:


    ~~~quote

    %{description}

    ~~~


    * **%{status_label}**: %{status}


  zulip_notify_unassignment: >
     %{user} hat die **Zuweisung an Sie** auf Ticket [[%{project}#%{id}] %{subject}](%{url}) **entfernt**.

  zulip_notify_updated: >
    %{user} hat Ticket [[%{project}#%{id}] %{subject}](%{url}) **geändert**.

  zulip_notify_destroyed: >
    %{user} hat Ticket [[%{project}#%{id}] %{subject}](%{url}) **gelöscht**.

  zulip_init_issue_subject: >
    %{user} hat Ticket [[%{project}#%{id}] %{subject}](%{url}) **erstellt**:


    ~~~quote

    %{description}

    ~~~

    * **%{assigned_to_label}**: %{assigned_to}

    * **%{status_label}**: %{status}

  zulip_update_version_subject_added: >
    %{user} hat Ticket [[%{project}#%{id}] %{subject}](%{url}) zur Version **%{fixed_version} erstellt**.

  zulip_update_version_subject_removed: >
    %{user} hat Ticket [[%{project}#%{id}] %{subject}](%{url}) zur Version **%{fixed_version} entfernt**.

  zulip_update_version_subject_status: >
    %{user} hat den Status von Ticket [[%{project}#%{id}] %{subject}](%{url}) von
    *~~%{previous_status}~~* auf **%{current_status} geändert**.

  zulip_notify_news_added: "**[%{title}](%{url})**\n%{user} hat eine **Neuigkeit hinzugefügt**."

  zulip_notify_news_comment_added: "**[%{title}](%{url})**\n%{user} hat die Neuigkeit **kommentiert**."

  zulip_notify_document_added: "**[%{title}](%{url})**\n%{user} hat ein **Dokument hinzugefügt** (%{category})."

  zulip_notify_file_added: "**[%{container}](%{url})**\n%{user} hat **Dateien hinzugefügt**."

  zulip_notify_message_posted: "**[%{subject}](%{url})**\n%{user} hat eine **Nachricht in %{board} geschrieben**."

  zulip_notify_wiki_added: "**[%{title}](%{url})**\n%{user} hat eine **Wiki-Seite erstellt**."

  zulip_notify_wiki_updated: "**[%{title}](%{url})**\n%{user} hat eine **Wiki-Seite aktualisiert**."

  zulip_notify_wiki_diff: "**Unterschied**: [%{url}](%{url})"
